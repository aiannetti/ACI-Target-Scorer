[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "target-scorer"
version = "0.1.0"
description = "Automated high-precision computer vision and deep learning metrology engine for NRA precision pistol targets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Antho"}
]
keywords = [
    "computer-vision",
    "deep-learning",
    "metrology",
    "nra-precision-pistol",
    "bullet-hole-detection",
    "inward-scoring",
    "sub-pixel",
    "u-net",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pillow-heif>=1.0.0",
    "sv-ttk>=2.6.0",
]

[project.optional-dependencies]
colab = [
    "google-colab-cli; python_version >= '3.12'",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0",
    "matplotlib>=3.7.0",
]
all = [
    "google-colab-cli; python_version >= '3.12'",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0",
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/aiannetti/ACI-Target-Scorer"
Repository = "https://github.com/aiannetti/ACI-Target-Scorer"
Documentation = "https://github.com/aiannetti/ACI-Target-Scorer#readme"
Issues = "https://github.com/aiannetti/ACI-Target-Scorer/issues"

[project.scripts]
target-scorer = "target_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["target_scorer*"]
